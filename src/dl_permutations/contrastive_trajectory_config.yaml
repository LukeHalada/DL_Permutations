tsp_config:
  cities_count: 20
  min: 0
  max: 10
  start: 1
  seed: 21

ga_config:
  n_runs: 100
  n_generations: 100
  population_size: 50
  mutation_rate: 0.1
  cross_rate: 0.1
  tournament_size: 5
  base_seed: 1000

training_config:
  negative_window: 20
  triplets_per_epoch: 50000
  val_ratio: 0.2
  batch_size: 256
  epochs: 30
  lr: 1.0e-3
  weight_decay: 1.0e-5
  max_patience: 6
  torch_seed: 0

model_config:
  emb_dim: 32
  hidden_size: 128
  out_dim:  64
  dropout: 0.1
  margin: 0.3
  normalize: True